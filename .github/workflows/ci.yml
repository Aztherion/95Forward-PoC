name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: postgres://forward:forward@localhost:5432/forward
      APP_DATABASE_URL: postgres://app_user:app_user@localhost:5432/forward
      APP_ENV: ci
      # Dummy Auth0 values: CI authenticates via the gated dev-login seam
      # (generateSessionCookie), so no live Auth0 tenant is needed.
      AUTH0_DOMAIN: test.us.auth0.com
      AUTH0_CLIENT_ID: test-client-id
      AUTH0_CLIENT_SECRET: test-client-secret
      AUTH0_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      APP_BASE_URL: http://localhost:3100
      E2E_TEST_MODE: "true"
      # AI runs in deterministic mock mode in CI — no ANTHROPIC/OPENAI keys, no paid calls.
      AI_MODE: mock
      # In-app feedback (Initiative 15) stays in mock in CI — composes the payload but never
      # calls GitHub and carries no token, so the suite never files a real issue.
      FEEDBACK_MODE: mock
      # Background jobs (Initiative 11): demo research provider + the worker's own queue schema.
      RESEARCH_MODE: demo
      JOBS_SCHEMA: graphile_worker
      JOBS_CONCURRENCY: "3"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forward
          POSTGRES_PASSWORD: forward
          POSTGRES_DB: forward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forward -d forward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Database setup (migrate + jobs schema + seed + embed)
        run: |
          pnpm db:wait
          pnpm db:migrate
          pnpm --filter @95forward/worker migrate:jobs
          pnpm --filter @95forward/db seed
          pnpm --filter @95forward/ai embed

      - name: Unit tests
        run: pnpm test

      # ----------------------------------------------------------------------------------------
      # E2E IS OFF IN CI ON PURPOSE. THIS IS A DECISION, NOT AN UNFINISHED JOB.
      #
      #     pnpm --filter @95forward/web test:e2e
      #
      # WHO IT IS OFF FOR. One developer works on this repository. They run the full suite locally
      # before every commit, and the PR description states the result. A CI run would therefore be
      # a second execution of a suite that has already passed, on slower hardware, for an audience
      # of one person who already has the answer.
      #
      # WHAT IT COSTS. ~290 specs against a live Postgres and a built Next app, plus a Chromium
      # download on every run. On a GitHub runner that is minutes of billed time per push, and the
      # PoC has no budget line for it.
      #
      # WHY NOT "IT IS FLAKY". It was, and that reason is now spent: I18b's larger seed lost races
      # that H3 then fixed at all 52 mutation sites (see AGENTS.md, "Writing an e2e spec"), and the
      # suite has run green at `workers: 2` with RETRIES OFF ever since. The step is off for cost
      # and audience, not because it cannot be trusted.
      #
      # WHAT WOULD CHANGE THE CALCULUS — turn it back on when EITHER happens:
      #   * a second developer joins, so "the author ran it" stops being a guarantee anyone else
      #     can rely on; or
      #   * the project leaves PoC mode, where an unreviewed merge becomes a real risk rather than
      #     a hypothetical one.
      # Uncommenting the four steps below is the whole change; nothing else needs to move.
      #
      # THE MERGE GATE MEANWHILE is a local full-suite run at `workers: 2` with retries OFF —
      # retries off because a flaky pass is not green — stated in the PR description.
      # ----------------------------------------------------------------------------------------
